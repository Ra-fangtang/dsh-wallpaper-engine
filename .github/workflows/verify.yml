# 每次 push / PR 跑一遍发版自检：语法、组合包声明、脱敏、tarball 内容。
# 不装依赖、不跑构建 —— 本插件没有依赖也没有构建步骤。
name: verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 自检 + 打包
        run: node scripts/verify.mjs --pack

      - name: 把 tarball 作为构建产物留档
        uses: actions/upload-artifact@v4
        with:
          name: dsh-wallpaper-engine-tgz
          path: dist/*.tgz
          if-no-files-found: error
